<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e2d3" />
    <meta name="color-scheme" content="light" />
    <!-- Nobody is meant to find this, so do not let a crawler index it. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <!-- Saved to a phone home screen it opens without browser furniture,
         which is most of the screen back on a small one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="suitfold" />
    <title>suitfold - a live card table you share with a link</title>
    <meta
      name="description"
      content="A table, a deck, and whoever you invite. Drag the cards around like you would at a kitchen table. No accounts, no install, nothing saved."
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
