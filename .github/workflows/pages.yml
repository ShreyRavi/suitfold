name: deploy

# suitfold is a static app: there is no server to deploy, only files to publish.
# Pushing to main puts the new build on Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Nothing ships that has not passed the engine tests. A wrong payout is
      # the one bug a family will not forgive.
      - run: bun run typecheck
      - run: bun test
      - run: bun run fuzz 25000

      - name: Build
        # Pages serves the site from /<repo>/, so the asset paths need that prefix.
        run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Single-page fallback
        # Pages has no rewrite rules. Copying index.html to 404.html makes any
        # deep link fall back to the app instead of a GitHub error page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
